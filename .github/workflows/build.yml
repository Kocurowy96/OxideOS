name: Build

on:
  push:
    branches: [main, daily-work]
  pull_request:
    branches: [main]

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -B build -S .

      - name: Build kernel
        run: cmake --build build
